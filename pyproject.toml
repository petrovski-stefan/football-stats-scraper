[project]
name = "leagues-teams-summarizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4==4.13.5",
    "fake-useragent==2.2.0",
    "lightgbm==4.6.0",
    "numpy==2.3.2",
    "pandas==2.2.3",
    "pydantic==2.11.7",
    "scipy==1.15.1",
    "selenium==4.27.1",
    "shin==0.2.2",
    "statsmodels==0.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "data", "config"]

[tool.ruff.lint]
# Pragmatic, bug-focused set: pycodestyle/pyflakes (flake8 parity) + isort,
# bugbear, comprehensions, simplify, pyupgrade, plus a low-noise stricter tier:
# Ruff-native (RUF), misc-lints (PIE), logging hygiene (LOG/G), no-blanket-ignore
# (PGH), and relative-import ban (TID).
select = ["E", "W", "F", "I", "B", "C4", "SIM", "UP", "RUF", "PIE", "LOG", "G", "PGH", "TID"]
ignore = ["E203"]  # whitespace-before-punctuation; conflicts with the formatter

[tool.ruff.lint.isort]
# Layered packages, imported absolutely: domain -> scrapers -> features, and
# domain -> features -> analysis -> ml, with qa off to the side. See CLAUDE.md "Architecture".
known-first-party = ["domain", "scrapers", "features", "analysis", "ml", "qa"]

[tool.ruff.lint.flake8-tidy-imports]
# Enforce the documented convention: absolute package imports only, never relative.
ban-relative-imports = "all"

[tool.ruff.format]
# Defaults are black-compatible (double quotes), matching the existing style.

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
strict = true
warn_unreachable = true  # not part of --strict
# mypy flags stacked @computed_field/@property (the standard pydantic idiom).
disable_error_code = ["prop-decorator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project is not installed as a package, so the repo root goes on sys.path for
# `from domain import stats`-style imports, the same way `python -m` sees it.
pythonpath = ["."]

[tool.coverage.run]
# `uv run coverage run -m pytest`: which lines of the six packages a test runs. A module no
# test imports still counts, at 0%. No % threshold: the scrapers' browser code and the old
# pipeline are untested on purpose; `/check` reads the lines of the diff.
source = ["domain", "scrapers", "features", "analysis", "ml", "qa"]
# Lines only, on Python's own monitoring: it costs the test run nearly nothing (the generated
# leak seasons: 53 s, 54-59 s without coverage), while tracing took 100-103 s. On Python 3.13
# it cannot measure branches; asked for branches, coverage falls back to tracing.
core = "sysmon"

[tool.coverage.report]
show_missing = true
skip_empty = true

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "complexipy==8.0.1",
    "coverage==7.16.2",
    "deptry==0.25.1",
    "hypothesis==6.170.5",
    "ipykernel==6.29.5",
    "mypy==1.14.1",
    "pandas-stubs==2.2.3.241126",
    "pyscn==1.32.2",
    "pytest==9.1.1",
    "ruff==0.15.22",
    "types-beautifulsoup4==4.12.0.20241020",
]

